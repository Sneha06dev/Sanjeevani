<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Plant Stores</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Add styles for the shop button */
        .shop-button {
            position: absolute; /* Position it absolutely within the body */
            top: 20px; /* Distance from the top */
            left: 20px; /* Distance from the left */
            background-color: #000000; /* Bootstrap primary color */
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            text-decoration: none; /* Remove underline */
            font-size: 16px; /* Adjust font size */
        }
        .shop-button:hover {
            background-color: #5f7388; /* Darker blue on hover */
        }
        /* Styles for the chatbot subtitle */
        .chatbot-title {
            font-size: 18px; /* Smaller font size for the chatbot title */
            margin-top: 7px; /* Margin from the main title */
            color: #ffffff; /* Dark color for visibility */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Find below the contact details of various nurseries and plant stores in your area:</p>
        <a href="http://localhost:3000" class="shop-button">Shop</a>
        <div class="nurseries-list">
            <div class="nursery-card">
                <h2>Green Leaf Nursery</h2>
                <p>Phone: +123 456 7890</p>
            </div>
            <div class="nursery-card">
                <h2>Blossom Plant Store</h2>
                <p>Phone: +098 765 4321</p>
            </div>
            <div class="nursery-card">
                <h2>Nature's Touch Nursery</h2>
                <p>Phone: +111 222 3333</p>
            </div>
            <div class="nursery-card">
                <h2>Eco Roots Plant Shop</h2>
                <p>Phone: +444 555 6666</p>
            </div>
        </div>
    </div>
</body>
</html>
