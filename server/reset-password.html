<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            background-color: #e0f7e9; /* Light green background */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            max-width: 90%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .toggle-password {
            display: block;
            margin-top: 10px;
            cursor: pointer;
            color: #007bff;
        }

        .toggle-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
            <span id="togglePassword" class="toggle-password">Show Password</span>
        </form>
    </div>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const token = window.location.pathname.split('/').pop();  // Extract token from URL
       const resetPasswordUrl = 'https://sanjeevani-7q5r.onrender.com/api/reset-password'; // Your server endpoint

    
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            if (password.value !== confirmPassword.value) {
                alert('Passwords do not match!');
                return;
            }
    
            try {
                const response = await fetch(resetPasswordUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: password.value
                    })
                });
    
                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                    window.location.href = '/login'; // Redirect to login page or another page
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while resetting your password.');
            }
        });
    
        document.getElementById('togglePassword').addEventListener('click', function() {
            if (password.type === 'password') {
                password.type = 'text';
                confirmPassword.type = 'text';
                this.textContent = 'Hide Password';
            } else {
                password.type = 'password';
                confirmPassword.type = 'password';
                this.textContent = 'Show Password';
            }
        });
    </script>
    
</body>
</html>
